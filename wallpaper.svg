<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
<style>
@keyframes twk{0%,100%{opacity:.25}50%{opacity:.9}}
@keyframes twk2{0%,100%{opacity:.15}50%{opacity:.7}}
.s1{animation:twk 2.1s ease-in-out infinite}
.s2{animation:twk 3.4s ease-in-out .6s infinite}
.s3{animation:twk2 1.8s ease-in-out 1.1s infinite}
.s4{animation:twk 4s ease-in-out .3s infinite}
</style>

<!-- deep night gradient sky -->
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0e0520"/>
    <stop offset="40%" stop-color="#1a0a38"/>
    <stop offset="70%" stop-color="#2a1050"/>
    <stop offset="100%" stop-color="#1a0830"/>
  </linearGradient>
  <linearGradient id="glow1" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ff69b4" stop-opacity=".18"/>
    <stop offset="100%" stop-color="#7b4fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="glow2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#4f9fff" stop-opacity=".12"/>
    <stop offset="100%" stop-color="#1a0a38" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="groundg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1e3820"/>
    <stop offset="100%" stop-color="#0a1810"/>
  </linearGradient>
  <linearGradient id="moong" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#fff8e8"/>
    <stop offset="100%" stop-color="#fde8c0"/>
  </linearGradient>
</defs>

<!-- sky -->
<rect width="1920" height="1080" fill="url(#sky)"/>

<!-- aurora-like glow blobs -->
<ellipse cx="480" cy="320" rx="520" ry="180" fill="url(#glow1)" opacity=".6"/>
<ellipse cx="1440" cy="260" rx="480" ry="160" fill="url(#glow2)" opacity=".7"/>
<ellipse cx="960" cy="400" rx="600" ry="120" fill="#a855f7" opacity=".04"/>

<!-- pixel grid overlay (subtle) -->
<rect width="1920" height="1080" fill="none" stroke="#ffffff" stroke-width=".5" opacity=".015"
  style="background-image:repeating-linear-gradient(0deg,transparent,transparent 39px,#fff 39px,#fff 40px),repeating-linear-gradient(90deg,transparent,transparent 39px,#fff 39px,#fff 40px)"/>

<!-- stars — large -->
<rect x="120" y="45" width="4" height="4" fill="#fff" opacity=".9" class="s1"/>
<rect x="340" y="88" width="3" height="3" fill="#fff" opacity=".8" class="s2"/>
<rect x="580" y="32" width="4" height="4" fill="#ffe8f0" opacity=".85" class="s3"/>
<rect x="820" y="70" width="3" height="3" fill="#fff" opacity=".7" class="s4"/>
<rect x="1060" y="28" width="4" height="4" fill="#e8f0ff" opacity=".9" class="s1"/>
<rect x="1280" y="62" width="3" height="3" fill="#fff" opacity=".8" class="s2"/>
<rect x="1520" y="40" width="4" height="4" fill="#fff8e8" opacity=".85" class="s3"/>
<rect x="1760" y="80" width="3" height="3" fill="#fff" opacity=".7" class="s4"/>
<rect x="200" y="140" width="2" height="2" fill="#fff" opacity=".6" class="s2"/>
<rect x="460" y="168" width="3" height="3" fill="#fff" opacity=".75" class="s1"/>
<rect x="700" y="122" width="2" height="2" fill="#ffe0f0" opacity=".65" class="s3"/>
<rect x="940" y="155" width="3" height="3" fill="#fff" opacity=".7" class="s4"/>
<rect x="1180" y="130" width="2" height="2" fill="#fff" opacity=".6" class="s2"/>
<rect x="1400" y="162" width="3" height="3" fill="#f0e8ff" opacity=".75" class="s1"/>
<rect x="1640" y="118" width="2" height="2" fill="#fff" opacity=".65" class="s3"/>
<rect x="1850" y="148" width="3" height="3" fill="#fff" opacity=".7" class="s4"/>

<!-- stars — small scattered -->
<rect x="80" y="200" width="2" height="2" fill="#fff" opacity=".4" class="s3"/>
<rect x="290" y="230" width="1" height="1" fill="#fff" opacity=".5" class="s1"/>
<rect x="510" y="210" width="2" height="2" fill="#ffe8f8" opacity=".45" class="s2"/>
<rect x="730" y="240" width="1" height="1" fill="#fff" opacity=".5" class="s4"/>
<rect x="990" y="195" width="2" height="2" fill="#e8eeff" opacity=".4" class="s1"/>
<rect x="1230" y="225" width="2" height="2" fill="#fff" opacity=".5" class="s3"/>
<rect x="1470" y="205" width="1" height="1" fill="#fff" opacity=".45" class="s2"/>
<rect x="1710" y="235" width="2" height="2" fill="#f8e8ff" opacity=".4" class="s4"/>
<rect x="150" y="310" width="2" height="2" fill="#fff" opacity=".35" class="s2"/>
<rect x="420" y="290" width="1" height="1" fill="#fff" opacity=".4" class="s3"/>
<rect x="650" y="340" width="2" height="2" fill="#fff" opacity=".35" class="s1"/>
<rect x="880" y="280" width="1" height="1" fill="#fff" opacity=".4" class="s4"/>
<rect x="1100" y="320" width="2" height="2" fill="#ffe0f8" opacity=".35" class="s2"/>
<rect x="1330" y="295" width="1" height="1" fill="#fff" opacity=".4" class="s1"/>
<rect x="1580" y="330" width="2" height="2" fill="#e8f8ff" opacity=".35" class="s3"/>
<rect x="1820" y="285" width="1" height="1" fill="#fff" opacity=".4" class="s4"/>

<!-- pixel moon -->
<rect x="1720" y="60" width="56" height="56" rx="0" fill="url(#moong)" opacity=".92"/>
<rect x="1720" y="60" width="8" height="8" fill="#0e0520" opacity=".7"/>
<rect x="1768" y="60" width="8" height="8" fill="#0e0520" opacity=".5"/>
<rect x="1720" y="108" width="8" height="8" fill="#0e0520" opacity=".4"/>
<!-- moon glow -->
<ellipse cx="1748" cy="88" rx="48" ry="48" fill="#fde8c0" opacity=".08"/>

<!-- pixel ✦ star decorations -->
<text x="240" y="52" font-family="Arial" font-size="14" fill="#ff9de2" opacity=".6" class="s1">✦</text>
<text x="680" y="88" font-family="Arial" font-size="10" fill="#a78bfa" opacity=".55" class="s3">✦</text>
<text x="1120" y="48" font-family="Arial" font-size="12" fill="#7dd3fc" opacity=".6" class="s2">✦</text>
<text x="1560" y="74" font-family="Arial" font-size="10" fill="#fcd34d" opacity=".5" class="s4">✦</text>
<text x="380" y="260" font-family="Arial" font-size="8" fill="#f9a8d4" opacity=".4" class="s1">✧</text>
<text x="900" y="220" font-family="Arial" font-size="9" fill="#86efac" opacity=".45" class="s3">✧</text>
<text x="1440" y="250" font-family="Arial" font-size="8" fill="#c084fc" opacity=".4" class="s2">✧</text>

<!-- distant mountains (pixel silhouette) -->
<polygon points="0,680 160,480 280,540 420,420 580,500 700,390 860,470 1000,360 1160,450 1300,380 1460,460 1600,350 1760,430 1920,380 1920,680" fill="#1a0838" opacity=".8"/>
<polygon points="0,700 100,560 220,610 380,520 520,580 680,500 820,560 960,480 1120,540 1280,490 1420,550 1580,480 1720,540 1920,490 1920,700" fill="#1a0c42" opacity=".9"/>

<!-- foreground hills / ground -->
<rect x="0" y="820" width="1920" height="260" fill="url(#groundg)"/>
<!-- ground highlight line -->
<rect x="0" y="820" width="1920" height="4" fill="#2a5028" opacity=".8"/>
<rect x="0" y="824" width="1920" height="2" fill="#3a6038" opacity=".5"/>

<!-- pixel trees silhouettes -->
<!-- tree cluster left -->
<rect x="40" y="720" width="12" height="100" fill="#0e2010"/>
<polygon points="46,680 14,740 78,740" fill="#0e2810"/>
<polygon points="46,700 20,748 72,748" fill="#122e14"/>
<polygon points="46,718 24,756 68,756" fill="#162e16"/>

<rect x="140" y="740" width="10" height="80" fill="#0e2010"/>
<polygon points="145,706 118,756 172,756" fill="#0e2810"/>
<polygon points="145,722 122,762 168,762" fill="#122e14"/>

<rect x="220" y="730" width="14" height="90" fill="#0e2010"/>
<polygon points="227,686 196,744 258,744" fill="#0e2810"/>
<polygon points="227,706 200,752 254,752" fill="#122e14"/>
<polygon points="227,722 204,760 250,760" fill="#162e16"/>

<!-- tree cluster right -->
<rect x="1660" y="724" width="12" height="96" fill="#0e2010"/>
<polygon points="1666,682 1636,742 1696,742" fill="#0e2810"/>
<polygon points="1666,702 1640,750 1692,750" fill="#122e14"/>
<polygon points="1666,720 1644,758 1688,758" fill="#162e16"/>

<rect x="1760" y="736" width="10" height="84" fill="#0e2010"/>
<polygon points="1765,702 1740,750 1790,750" fill="#0e2810"/>
<polygon points="1765,718 1744,758 1786,758" fill="#122e14"/>

<rect x="1850" y="718" width="14" height="102" fill="#0e2010"/>
<polygon points="1857,678 1824,740 1890,740" fill="#0e2810"/>
<polygon points="1857,698 1828,748 1886,748" fill="#122e14"/>
<polygon points="1857,716 1832,756 1882,756" fill="#162e16"/>

<!-- fireflies / floating lights -->
<rect x="320" y="680" width="3" height="3" fill="#fcd34d" opacity=".7" class="s2"/>
<rect x="540" y="640" width="2" height="2" fill="#86efac" opacity=".6" class="s4"/>
<rect x="760" y="700" width="3" height="3" fill="#f9a8d4" opacity=".65" class="s1"/>
<rect x="980" y="660" width="2" height="2" fill="#fcd34d" opacity=".55" class="s3"/>
<rect x="1200" y="690" width="3" height="3" fill="#7dd3fc" opacity=".6" class="s2"/>
<rect x="1420" y="650" width="2" height="2" fill="#86efac" opacity=".65" class="s4"/>
<rect x="1640" y="680" width="3" height="3" fill="#fcd34d" opacity=".55" class="s1"/>

<!-- pixel scanline texture (subtle) -->
<rect x="0" y="0" width="1920" height="1080" fill="none" opacity=".018"
  style="background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0px,rgba(255,255,255,.03) 1px,transparent 1px,transparent 4px)"/>

<!-- vignette corners -->
<radialGradient id="vig" cx="50%" cy="50%" r="75%">
  <stop offset="60%" stop-color="transparent"/>
  <stop offset="100%" stop-color="#000000" stop-opacity=".55"/>
</radialGradient>
<rect width="1920" height="1080" fill="url(#vig)"/>
</svg>
