<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Loading... ✦</title>
<style>
:root{--ct:#f0edea;--cm:#d8d4cf;--cbr:#b0aca6;--wc:#fff;--ink:#1a1714;--ink2:#5a5650;--ink3:#9a9590;--wall1:#f0e4f8;--wall2:#e4eef8;--wall3:#f8eee4;--c1:#b8e4f0;--c2:#e4d8f8;--c3:#b8f0d8;--c4:#f8e0b8;--c5:#f8c8d8}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
body{background:linear-gradient(140deg,var(--wall1) 0%,var(--wall2) 55%,var(--wall3) 100%);cursor:none;display:flex;align-items:center;justify-content:center;color:var(--ink)}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.28) 1px,transparent 1px);background-size:20px 20px;pointer-events:none}
#cur{position:fixed;width:16px;height:16px;pointer-events:none;z-index:99999;top:0;left:0}#cur svg{display:block}@media(hover:none){#cur{display:none}body{cursor:auto}}
#mb{position:fixed;top:0;left:0;right:0;height:24px;z-index:10;background:linear-gradient(180deg,var(--ct),var(--cm));border-bottom:1px solid var(--cbr);display:flex;align-items:center;justify-content:space-between;padding:0 10px}
.mb-i{font-size:.68rem;font-weight:700;color:var(--ink);padding:.1rem .4rem}.mb-r{font-size:.62rem;font-weight:700;color:var(--ink2);font-family:'Courier New',monospace}
.star{position:absolute;pointer-events:none;animation:twk 3s ease-in-out infinite;color:rgba(120,80,180,.24);font-size:.65rem}@keyframes twk{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:.75;transform:scale(1.25)}}
#stage{position:relative;z-index:2;width:min(720px,92vw);background:var(--wc);border:2px solid var(--cbr);box-shadow:5px 5px 0 rgba(0,0,0,.22),9px 9px 0 rgba(0,0,0,.06);overflow:hidden}
.wtb{height:27px;background:linear-gradient(180deg,var(--ct),var(--cm));border-bottom:1px solid var(--cbr);display:flex;align-items:center;padding:0 8px;gap:6px;position:relative}.tls{display:flex;gap:5px}.tl{width:11px;height:11px;border-radius:50%;border:1px solid rgba(0,0,0,.18)}.tl-r{background:#ff5f56}.tl-y{background:#febc2e}.tl-g{background:#28c840}.title{position:absolute;left:50%;transform:translateX(-50%);font-size:.64rem;font-weight:700;color:var(--ink2)}
#screen{padding:1rem;background:linear-gradient(180deg,#fff 0%,#f8f5f0 100%)}
#track{position:relative;height:250px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);background:linear-gradient(160deg,#f8d8f0 0%,#e4eef8 42%,#b8f0d8 100%);overflow:hidden}
#track::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.5) 1px,transparent 1px);background-size:18px 18px;opacity:.8}
.folder{position:absolute;width:82px;height:64px;right:32px;bottom:42px}.folder svg{width:100%;height:100%;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.2))}
#runner{position:absolute;left:-96px;bottom:22px;width:86px;image-rendering:pixelated;filter:drop-shadow(2px 4px 0 rgba(0,0,0,.35));animation:runAcross 1.35s linear infinite}#runner img{width:86px;display:block;image-rendering:pixelated}
@keyframes runAcross{from{transform:translateX(0)}to{transform:translateX(calc(min(720px,92vw) + 120px))}}
.ground{position:absolute;left:0;right:0;bottom:0;height:32px;background:repeating-linear-gradient(90deg,#1a1714 0,#1a1714 16px,#5a5650 16px,#5a5650 32px)}
.copy{position:absolute;left:28px;top:30px;max-width:420px}.kicker{font-size:.5rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:.4rem}.copy h1{font-size:1.6rem;line-height:1.05;letter-spacing:-.04em;margin-bottom:.4rem}.copy p{font-size:.76rem;line-height:1.65;color:var(--ink2)}
#panel{margin-top:1rem;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);background:#fff;padding:.75rem}.status{display:flex;justify-content:space-between;gap:1rem;font-family:'Courier New',monospace;font-size:.66rem;font-weight:700;color:var(--ink2);margin-bottom:.45rem}#bar{height:14px;border:2px solid var(--ink);background:#f7f3ee;overflow:hidden}#fill{height:100%;width:0%;background:repeating-linear-gradient(90deg,var(--c1) 0,var(--c1) 18px,var(--c2) 18px,var(--c2) 36px,var(--c3) 36px,var(--c3) 54px,var(--c5) 54px,var(--c5) 72px);transition:width .08s linear}.skip{position:fixed;right:18px;bottom:16px;z-index:20;font-size:.56rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);cursor:pointer}.skip:hover{color:var(--ink)}
.sp{position:fixed;pointer-events:none;z-index:99;animation:spF .5s ease-out forwards}@keyframes spF{to{opacity:0;transform:scale(0) translateY(-6px)}}
@media(max-width:620px){#stage{width:94vw}#track{height:230px}.copy h1{font-size:1.28rem}.copy{left:20px;right:20px}.folder{right:16px;width:68px}}
</style>
</head>
<body>
<div id="cur"><svg width="16" height="16" viewBox="0 0 16 16"><polygon points="2,2 2,14 5,10 7,15 9,14 7,9.5 11,9.5" fill="#1a1714" stroke="#fff" stroke-width=".8" stroke-linejoin="round"/></svg></div>
<div id="mb"><div><span class="mb-i" style="font-weight:800">Mia Zhou</span><span class="mb-i">Finder</span><span class="mb-i">Loading</span></div><span class="mb-r" id="clock">00:00</span></div>
<span class="star" style="top:13%;left:10%;animation-delay:.4s">✦</span><span class="star" style="top:24%;right:14%;animation-delay:1s">✧</span><span class="star" style="bottom:18%;left:16%;animation-delay:1.6s">✦</span><span class="star" style="bottom:28%;right:10%;animation-delay:.8s">+</span>
<div id="stage">
  <div class="wtb"><div class="tls"><div class="tl tl-r" onclick="goNow()"></div><div class="tl tl-y"></div><div class="tl tl-g"></div></div><span class="title" id="panelTitle">opening portfolio</span></div>
  <div id="screen">
    <div id="track">
      <div class="copy"><div class="kicker">loading shortcut</div><h1 id="headline">Running to your desktop</h1><p id="statusTxt">Tiny Mia is sprinting across the desk. No enter key needed.</p></div>
      <div class="folder"><svg viewBox="0 0 58 50"><rect x="2" y="12" width="54" height="34" fill="#ddd0ff" stroke="#1a1714" stroke-width="2"/><path d="M2 12L2 8Q2 6 4 6L20 6Q24 6 26 10L28 12Z" fill="#b09ef8" stroke="#1a1714" stroke-width="2"/><text x="29" y="33" text-anchor="middle" font-family="Arial" font-size="6.5" font-weight="800" fill="#3a1a6a">OPEN</text></svg></div>
      <div id="runner"><img id="runnerImg" src="sprite_1.png" alt="running Mia"></div>
      <div class="ground"></div>
    </div>
    <div id="panel"><div class="status"><span id="line">mounting desktop</span><span id="pct">0%</span></div><div id="bar"><div id="fill"></div></div></div>
  </div>
</div>
<div class="skip" onclick="goNow()">skip ></div>
<script>
const params=new URLSearchParams(location.search);const DEST=params.get('dest')||'resume.html';const TITLE=params.get('title')||'portfolio';document.getElementById('panelTitle').textContent='opening '+TITLE+'.app';
const cur=document.getElementById('cur');document.addEventListener('mousemove',e=>{cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px'});
function uc(){const d=new Date();document.getElementById('clock').textContent=d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')}uc();setInterval(uc,12000);
const poses=['sprite_1.png','sprite_2.png','sprite_3.png','sprite_4.png'];poses.forEach(s=>{const i=new Image();i.src=s});let pi=0;setInterval(()=>{pi=(pi+1)%poses.length;document.getElementById('runnerImg').src=poses[pi]},120);
const msgs=['mounting desktop','sorting folders','polishing pixels','opening '+TITLE];let prog=0;const fill=document.getElementById('fill'),pct=document.getElementById('pct'),line=document.getElementById('line');const t=setInterval(()=>{prog=Math.min(100,prog+10+Math.random()*18);fill.style.width=prog+'%';pct.textContent=Math.floor(prog)+'%';line.textContent=msgs[Math.min(msgs.length-1,Math.floor(prog/26))];if(prog>=100){clearInterval(t);setTimeout(goNow,180)}},80);
function goNow(){window.location.href=DEST}
const SC=['#7ec8c8','#a78bfa','#f9a8d4','#fcd34d','#6ee7b7'];document.addEventListener('click',e=>{const s=document.createElement('div');s.className='sp';const sz=3+Math.random()*4;s.style.cssText=`left:${e.clientX}px;top:${e.clientY}px;width:${sz}px;height:${sz}px;background:${SC[~~(Math.random()*SC.length)]}`;document.body.appendChild(s);setTimeout(()=>s.remove(),500)});
</script>
</body>
</html>
